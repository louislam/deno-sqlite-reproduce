name: Test

on:
  push:
    branches: ["test"]
  pull_request:
    branches: ["test"]

permissions:
  contents: read

jobs:
  deno-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        deno: [ v2.2.11, v2.3.0-rc.2 ]

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}
          
      - name: Run tests
        run: deno test --allow-all
